<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1SBERG - Registration</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome for Cyber & UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        ice: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                            950: '#032035',
                        },
                        cyber: {
                            dark: '#030712',
                            card: 'rgba(10, 25, 47, 0.75)',
                            border: 'rgba(56, 189, 248, 0.2)',
                            glow: 'rgba(56, 189, 248, 0.4)',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Cyberpunk Ice Aesthetic Background Grid & Scanlines */
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.15), transparent 70%),
                linear-gradient(to bottom, rgba(3, 7, 18, 0.8), rgba(3, 7, 18, 0.95)),
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #f1f5f9;
        }

        /* Glassmorphism utility */
        .glass-card {
            background: rgba(10, 25, 47, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.18);
        }

        .pulse-cyan {
            box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
            animation: pulse-cyan 2s infinite;
        }
        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }
    </style>
</head>
<body class="h-full flex items-center justify-center font-sans antialiased overflow-hidden selection:bg-cyan-500 selection:text-black relative p-4">

    <!-- Ambient Background Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[100px] pointer-events-none -z-10"></div>

    <!-- Registration Container -->
    <div class="glass-card max-w-md w-full rounded-2xl border-2 border-cyan-500/40 p-8 sm:p-10 shadow-[0_0_35px_rgba(56,189,248,0.15)] relative overflow-hidden">
        
        <!-- Corner Accent -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-cyan-400/10 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Back to Login -->
        <a href="/login" class="absolute top-5 left-5 text-slate-400 hover:text-cyan-400 transition-colors text-sm flex items-center gap-2 font-mono">
            <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Abort</span>
        </a>

        <!-- Header / Logo -->
        <div class="text-center mb-8 mt-4">
            <div class="relative inline-block group mb-4">
                <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl blur opacity-40 group-hover:opacity-75 transition duration-300"></div>
                <img src="{{ url_for('static', filename='569829736_122104262697064173_1158095115546906188_n.jpg') }}" 
                     onerror="this.onerror=null; this.src='https://placehold.co/100x100/0a192f/38bdf8?text=A1S';" 
                     alt="A1SBERG Logo" 
                     class="relative h-14 w-14 object-cover rounded-xl border border-cyan-400/50 shadow-md mx-auto">
            </div>
            <h1 class="text-2xl font-extrabold tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 via-ice-200 to-blue-400 font-mono mb-2">
                A1SBERG
            </h1>
            <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-cyan-950/80 border border-cyan-800 text-cyan-400 text-[10px] font-mono shadow-inner uppercase tracking-widest">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 pulse-cyan"></span>
                <span>Registration</span>
            </div>
        </div>

        <!-- Flask Flash Messages (Optional, for validation errors) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="rounded-lg p-3 mb-4 text-xs font-mono flex items-center gap-2 border
                    {% if category == 'success' %}
                    bg-emerald-950/60 border-emerald-700/80 text-emerald-300
                    {% else %}
                    bg-red-950/60 border-red-800/80 text-red-300
                    {% endif %}">
                    <i class="fa-solid {{ 'fa-circle-check text-emerald-400' if category == 'success' else 'fa-triangle-exclamation text-red-400' }}"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}


        <!-- Registration Form -->
        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-[10px] font-mono text-cyan-400 uppercase tracking-widest mb-1.5 flex items-center gap-2">
                    <i class="fa-solid fa-user-ninja text-cyan-500/70"></i> Username
                </label>
                <input type="text" id="username" name="username" required
                       class="w-full bg-slate-950/90 border border-slate-700/80 rounded-lg px-4 py-2.5 text-cyan-100 font-mono text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all shadow-inner placeholder:text-slate-600" 
                       placeholder="e.g., zero_cool">
            </div>
            
            <div>
                <label for="email" class="block text-[10px] font-mono text-cyan-400 uppercase tracking-widest mb-1.5 flex items-center gap-2">
                    <i class="fa-solid fa-envelope text-cyan-500/70"></i> Email
                </label>
                <input type="email" id="email" name="email" required
                       class="w-full bg-slate-950/90 border border-slate-700/80 rounded-lg px-4 py-2.5 text-cyan-100 font-mono text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all shadow-inner placeholder:text-slate-600" 
                       placeholder="student@gmail.com">
            </div>

            <div>
                <label for="password" class="block text-[10px] font-mono text-cyan-400 uppercase tracking-widest mb-1.5 flex items-center gap-2">
                    <i class="fa-solid fa-key text-cyan-500/70"></i> Access Key
                </label>
                <input type="password" id="password" name="password" required
                       class="w-full bg-slate-950/90 border border-slate-700/80 rounded-lg px-4 py-2.5 text-cyan-100 font-mono text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all shadow-inner placeholder:text-slate-600" 
                       placeholder="Create secure key">
            </div>

            <div>
                <label for="confirm_password" class="block text-[10px] font-mono text-cyan-400 uppercase tracking-widest mb-1.5 flex items-center gap-2">
                    <i class="fa-solid fa-shield-check text-cyan-500/70"></i> Verify Key
                </label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       class="w-full bg-slate-950/90 border border-slate-700/80 rounded-lg px-4 py-2.5 text-cyan-100 font-mono text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all shadow-inner placeholder:text-slate-600" 
                       placeholder="Re-enter secure key">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-mono font-bold py-3 px-4 rounded-xl transition-all shadow-[0_0_15px_rgba(14,165,233,0.3)] hover:shadow-[0_0_20px_rgba(56,189,248,0.5)] tracking-wide text-sm mt-6 flex items-center justify-center gap-3 group active:scale-95 duration-200">
                <span>REGISTER</span>
                <i class="fa-solid fa-microchip text-xs group-hover:rotate-12 transition-transform"></i>
            </button>
        </form>

        <!-- Footer Help Text -->
        <div class="mt-6 text-center border-t border-slate-800/80 pt-4">
            <p class="text-[10px] text-slate-500 font-mono tracking-wider">
                Already have account? <br/>
                <a href="/login" class="text-cyan-400 hover:text-cyan-300 transition-colors border-b border-cyan-400/30 hover:border-cyan-300 pb-0.5 mt-1 inline-block">click here</a>
            </p>
        </div>
    </div>

</body>
</html>
